services:
  - type: web
    name: serevo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: WFM_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
