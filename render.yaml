services:
  - type: web
    name: serevo
    runtime: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --max-requests 500 --max-requests-jitter 50 --timeout 120 --preload
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: WFM_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.9"
