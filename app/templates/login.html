{% extends "base.html" %}
{% block title %}Sign In — {{ brand_name }}{% endblock %}

{% block content %}
<div class="login-card">
  <h1>{{ brand_name }}</h1>
  <p>{{ brand_tagline }}</p>

  <form method="POST" action="/login">
    <label for="email">Email</label>
    <input type="email" id="email" name="email"
           placeholder="you@demo.serevo.app" required>

    {% if is_demo %}
    <p class="hint">
      Demo accounts: <code>viewer@demo.serevo.app</code> /
      <code>admin@demo.serevo.app</code>
    </p>
    {% endif %}

    <button type="submit">Sign in</button>
  </form>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
</div>
{% endblock %}
