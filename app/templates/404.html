{% extends "base.html" %}
{% block title %}Page Not Found — {{ brand_name }}{% endblock %}
{% block content %}
<div style="text-align:center;padding:80px 24px;">
  <h1 style="font-size:4rem;color:var(--brand-accent);margin:0;">404</h1>
  <p style="font-size:1.2rem;color:#666;margin:12px 0 24px;">The page you're looking for doesn't exist.</p>
  <a href="/" style="display:inline-block;padding:10px 24px;background:var(--brand-accent);color:#fff;border-radius:6px;text-decoration:none;">Back to Dashboard</a>
</div>
{% endblock %}
