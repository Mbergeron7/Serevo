{% extends "base.html" %}
{% block title %}Setup — {{ brand_name }}{% endblock %}

{% block content %}
<div class="login-card">
  <h1>Welcome to {{ brand_name }}</h1>
  <p>Create your admin account to get started.</p>

  <form method="POST" action="/setup">
    <div class="form-group">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="Jane Smith">
    </div>
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>
    <div class="form-group">
      <label for="password">Password *</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirm">Confirm Password *</label>
      <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required>
    </div>

    <button type="submit">Create Account &amp; Sign In</button>
  </form>

  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
</div>
{% endblock %}
